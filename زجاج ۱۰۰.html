else b=`<div class="card"><h3>ویرایش اطلاعات</h3><form data-f="prof"><div class="two"><div><label>نام</label><input name="n" value="${esc(u.n)}" required></div><div><label>سن</label><input name="a" type="number" min="5" max="100" value="${esc(u.a)}" required></div><div><label>ایمیل</label><input name="e" type="email" value="${esc(u.e)}"></div><div><label>شهر</label><input name="ci" value="${esc(u.ci)}"></div></div><button>ذخیره</button></form></div><div class="card"><h3>تغییر رمز عبور</h3><form data-f="pwd"><label>رمز فعلی</label><input name="o" type="password" required><label>رمز جدید (حداقل ۸ کاراکتر)</label><input name="p" type="password" minlength="8" required><button>تغییر رمز</button></form></div>`;
return`<h2>سلام ${esc(u.n)} 👋</h2>${M()}<div class="lay"><div class="side">${T.map(t=>`<button class="${ptab===t[0]?'on':''}" data-a="ptab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div><div>${b}</div></div>`}

const h=opPanel0().replace('<div class="tabs">',`<div class="tabs"><button class="${tab==='db'?'on':''}" data-a="tab" data-id="db">داشبورد</button>`);if(tab!=='db')return h;
const rev=DB.enr.reduce((n,e)=>n+(cour(e.c)?.p||0),0),pend=DB.enr.filter(e=>cour(e.c)?.ty==='online'&&!DB.cls.some(x=>x.u===e.u&&x.c===e.c)),nm=id=>DB.users.find(u=>u.id===id);

<h3>آخرین خریدها</h3><div class="card tw"><table><tr><th>کاربر</th><th>دوره</th><th>زمان</th></tr>${DB.enr.slice(-8).reverse().map(e=>`<tr><td>${esc(nm(e.u)?.n)}</td><td>${esc(cour(e.c)?.t)}</td><td>${fa(e.tm)}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">خریدی ثبت نشده.</td></tr>'}</table></div>`}
Object.assign(A,{pal:e=>{pal=e.dataset.id;st.set('zj_pal',pal);document.documentElement.dataset.pal=pal;document.querySelectorAll('.pal').forEach(x=>x.classList.toggle('on',x.dataset.id===pal))},cat:e=>{cat=e.dataset.id;render()},print:()=>print(),done:e=>{const u=me();if(!u)return;const m=(DB.pg[u.id]=DB.pg[u.id]||{}),l=(m[e.dataset.id]=m[e.dataset.id]||[]),i=l.indexOf(e.dataset.i);i<0?l.push(e.dataset.i):l.splice(i,1);save();if(i<0&&Object.values(m).reduce((a,x)=>a+x.length,0)%5===0)burst();const p=pct(u.id,cour(e.dataset.id)),pt=$('#pt'),pi=$('#pi');if(pt)pt.textContent='پیشرفت شما: '+faN(p)+'٪';if(pi)pi.style.width=p+'%'},sln:()=>slGo(slI+1),slp:()=>slGo(slI-1),sld:e=>slGo(+e.dataset.id),delch:e=>{const c=cour(e.dataset.id);if(c){c.chs=(c.chs||[]).filter(h=>h.id!==e.dataset.i);c.v.forEach(v=>{if(v.ch===e.dataset.i)v.ch=''});save();render()}},dela:e=>{const x=DB.an.find(y=>y.id===e.dataset.id);if(x){fdel(x.f);DB.an=DB.an.filter(y=>y!==x);save();render()}},sc:()=>document.getElementById('grid')?.scrollIntoView({behavior:'smooth'}),flt:e=>{flt=e.dataset.id;render()},ptab:e=>{ptab=e.dataset.id;msg=null;render()},eye:e=>{const i=e.parentNode.querySelector('input');i.type=i.type==='password'?'text':'password'}});

async pwd(f){const u=me(),d=Object.fromEntries(new FormData(f));if(!u)return;if((await sha(u.s+'$'+d.o))!==u.h)return flash('رمز فعلی اشتباه است');if(d.p.length<8)return flash('رمز جدید حداقل ۸ کاراکتر باشد');u.s=uid();u.h=await sha(u.s+'$'+d.p);save();flash('رمز با موفقیت تغییر کرد','o')}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='q'){q=t.value;$('#grid').innerHTML=gridHTML()}
if(t.name==='p'&&t.form?.dataset.f==='register'){const v=t.value;let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/\W/.test(v))s++;const m=t.form.querySelector('.meter i');if(m)m.style.width=s*25+'%'}});

/* Lightweight interactions: safe additions, independent from course logic */
(()=>{
  const aura=document.createElement('div');aura.id='zojajAura';document.body.appendChild(aura);
  const top=document.createElement('button');top.id='zojajTop';top.type='button';top.textContent='↑';
  top.setAttribute('aria-label','بازگشت به بالای صفحه');top.title='بازگشت به بالا';document.body.appendChild(top);
  let raf=0,lastX=0,lastY=0;
  document.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch')return;
    lastX=e.clientX;lastY=e.clientY;
    if(!raf)raf=requestAnimationFrame(()=>{aura.style.left=lastX+'px';aura.style.top=lastY+'px';raf=0});
  },{passive:true});
  const scrollUI=()=>{
    top.classList.toggle('show',window.scrollY>360);
    const p=document.getElementById('sp');
    if(p){const max=document.documentElement.scrollHeight-innerHeight;p.style.transform=`scaleX(${max>0?scrollY/max:0})`}
  };
  addEventListener('scroll',scrollUI,{passive:true});scrollUI();
  top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,.btn');
    if(!b||b.id==='zojajTop')return;
    const r=b.getBoundingClientRect(),s=document.createElement('span');
    s.className='zojaj-ripple';s.style.left=(e.clientX-r.left-6)+'px';s.style.top=(e.clientY-r.top-6)+'px';
    if(getComputedStyle(b).position==='static')b.style.position='relative';
    b.style.overflow='hidden';b.appendChild(s);setTimeout(()=>s.remove(),700);
  });
  // Reveal newly rendered content without hiding it when observers are unavailable.
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>entries.forEach(en=>{
      if(en.isIntersecting){en.target.classList.add('zojaj-visible');io.unobserve(en.target)}
    }),{threshold:.06});
    const watch=()=>document.querySelectorAll('main .card,main .stat,main .feat .card').forEach(el=>{
      if(!el.dataset.zojajSeen){el.dataset.zojajSeen='1';io.observe(el)}
    });
    new MutationObserver(watch).observe(document.getElementById('app'),{childList:true,subtree:true});
    watch();
  }
})();
